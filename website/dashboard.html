<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALKI | Unified Security Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            padding: 120px 5% 50px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(15, 20, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .stat-card h3 {
            color: #8892b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 42px;
            font-weight: 800;
            color: #fff;
        }
        .value.neon-red { color: #ff0055; text-shadow: 0 0 15px rgba(255,0,85,0.4); }
        .value.neon-cyan { color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.4); }
        .value.neon-purple { color: #b829ff; text-shadow: 0 0 15px rgba(184,41,255,0.4); }

        .dashboard-main {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }

        .accounts-sidebar {
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            height: fit-content;
        }
        .accounts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .account-item {
            display: flex;
            align-items: center;
            padding: 12px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }
        .account-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 255, 204, 0.3);
        }
        .account-icon {
            width: 32px;
            height: 32px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .account-icon img { width: 18px; }
        .account-details h4 { margin: 0; font-size: 13px; color: #fff; }
        .account-details p { margin: 0; font-size: 11px; color: #8892b0; }

        .btn-add-account {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px dashed rgba(0, 255, 204, 0.5);
            color: #00ffcc;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-add-account:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .threat-feed {
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        .feed-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .threat-item {
            background: rgba(15, 20, 35, 0.9);
            border-left: 4px solid #ff0055;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .threat-item:hover {
            transform: translateY(-2px);
        }
        .threat-item.safe { border-left-color: #00ffcc; }
        .threat-item.warn { border-left-color: #ffaa00; }

        .threat-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            color: #8892b0;
        }
        .threat-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }
        .threat-snippet {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 15px;
            font-style: italic;
        }
        
        .heuristics-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .heuristic-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .heuristic-badge.high { background: rgba(255, 0, 85, 0.15); border-color: #ff0055; color: #ff0055; }
        .heuristic-badge.medium { background: rgba(255, 170, 0, 0.15); border-color: #ffaa00; color: #ffaa00; }

        /* Auth Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #0f1423;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0,255,204,0.2);
            padding: 40px;
            border-radius: 16px;
            width: 400px;
            text-align: center;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #fff;
            outline: none;
        }
        .modal-input:focus { border-color: #00ffcc; }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>

    <nav class="navbar">
        <div class="logo">
            <svg viewBox="0 0 24 24" class="kalki-icon"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 2.18c3.55.93 6 4.19 6 7.91 0 3.73-2.45 6.98-6 7.91-3.55-.93-6-4.19-6-7.91 0-3.72 2.45-6.98 6-7.91z"/></svg>
            <span class="logo-text">KALKI</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#features">Features</a>
            <a href="dashboard.html" class="nav-btn" style="border: 1px solid rgba(0,255,204,0.5); background: rgba(0,255,204,0.1); color: #00ffcc;">Dashboard</a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <div class="stats-grid">
            <div class="stat-card glass">
                <h3>Total Scans</h3>
                <div class="value neon-cyan" id="stat-scans">0</div>
            </div>
            <div class="stat-card glass">
                <h3>Threats Blocked</h3>
                <div class="value neon-red" id="stat-blocked">0</div>
            </div>
            <div class="stat-card glass">
                <h3>Linked Accounts</h3>
                <div class="value neon-purple" id="stat-accounts">0</div>
            </div>
        </div>

        <div class="dashboard-main">
            <!-- Sidebar -->
            <aside class="accounts-sidebar">
                <div class="accounts-header">
                    <h3 style="margin:0; font-size:16px;">Protected Accounts</h3>
                </div>
                
                <div id="account-list">
                    <!-- Accounts injected via JS -->
                </div>

                <button class="btn-add-account" id="btn-connect">
                    + Connect Gmail
                </button>
            </aside>

            <!-- Main Feed -->
            <section class="threat-feed">
                <div class="feed-header">
                    <h2 style="margin:0;">Combined Threat Feed</h2>
                    <span style="font-size:12px; color:#8892b0;">Live Analysis</span>
                </div>
                
                <div id="feed-list">
                    <!-- Feed injected via JS -->
                    <div style="text-align:center; padding: 40px; color: #8892b0;">
                        No accounts linked yet. Connect your Gmail to start scanning.
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal">
            <svg style="width:48px; fill:#00ffcc; margin-bottom:10px;" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
            <h2 style="margin:0 0 10px 0; color:#fff;">Connect Google Account</h2>
            <p style="color:#8892b0; font-size:13px;">Securely connect your inbox for continuous threat monitoring.</p>
            
            <input type="email" id="auth-email" class="modal-input" placeholder="Enter your Gmail address" />
            
            <button id="btn-auth-submit" class="cta-btn primary-btn pulse-anim" style="width:100%; border:none; cursor:pointer;">
                Authorize via Google OAuth
            </button>
            <button id="btn-auth-cancel" style="margin-top:15px; background:none; border:none; color:#8892b0; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
